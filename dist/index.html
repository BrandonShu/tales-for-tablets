<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17366f">
  <meta name="description" content="Johnny Builds to Mars — a playful, interactive read-aloud adventure from Parker & Pine.">
  <title>Johnny Builds to Mars | Parker & Pine</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%23173570'/%3E%3Cpath d='M19 44c8-19 18-24 29-28-1 12-7 23-25 31z' fill='%23ffd54a'/%3E%3Ccircle cx='39' cy='25' r='5' fill='%2379ddff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Return to the bookshelf"><span class="pine">▲</span><span>Parker <i>&amp;</i> Pine</span></button>
    <button class="sound" id="soundBtn" aria-pressed="true" aria-label="Turn sounds off">🔊</button>
  </header>

  <main>
    <section class="library" id="library" aria-labelledby="libraryTitle">
      <div class="welcome">
        <p class="eyebrow">A little library for big imaginations</p>
        <h1 id="libraryTitle">What shall we read?</h1>
        <p>Pick a book, get cozy, and touch everything that sparkles.</p>
      </div>
      <div class="shelf" aria-label="Book shelf">
        <button class="book featured" id="openBook">
          <span class="book-stars">✦　·　✧</span>
          <span class="book-kicker">Parker &amp; Pine presents</span>
          <strong>Johnny<br>Builds to<br><em>Mars!</em></strong>
          <span class="rocket">🚀</span>
          <span class="author">A build-it-yourself adventure</span>
        </button>
        <div class="book soon lemon"><span>Coming soon</span><b>The Moon<br>Picnic</b><i>🌙</i></div>
        <div class="book soon blue"><span>Coming soon</span><b>Cloud<br>Collectors</b><i>☁️</i></div>
        <div class="shelf-edge"></div>
      </div>
      <button class="read-cta" id="startBtn">Read Johnny’s story <span>🚀</span></button>
    </section>

    <section class="reader" id="reader" hidden aria-live="polite">
      <div class="reader-head">
        <button class="back-library" id="shelfBtn">⌂ <span>Bookshelf</span></button>
        <div class="progress-wrap">
          <span id="pageLabel">Cover</span>
          <div class="progress" aria-hidden="true"><i id="progressFill"></i></div>
        </div>
        <button class="read-aloud" id="readBtn">▶ Read to me</button>
      </div>

      <article class="spread" id="spread">
        <div class="scene" id="scene" aria-label="Interactive story scene"></div>
        <div class="story-card">
          <p class="page-number" id="pageNumber"></p>
          <h2 id="pageTitle"></h2>
          <p id="storyText"></p>
          <div class="prompt" id="prompt"></div>
        </div>
      </article>

      <nav class="page-nav" aria-label="Book pages">
        <button id="prevBtn" class="nav-btn">‹ <span>Back</span></button>
        <div class="dots" id="dots" aria-label="Choose a page"></div>
        <button id="nextBtn" class="nav-btn"><span>Next</span> ›</button>
      </nav>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
